[project]
name = "comfyui-custom-api"
version = "0.2.0"
description = "Custom model APIs, provider management, and bilingual nodes for ComfyUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.11.8", "Pillow>=10", "numpy>=1.25"]
keywords = ["comfyui", "custom-nodes", "api", "llm", "vision", "image-generation"]

[project.urls]
Repository = "https://github.com/Einzieg/ComfyUI-custom-api"
Documentation = "https://github.com/Einzieg/ComfyUI-custom-api#readme"
"Bug Tracker" = "https://github.com/Einzieg/ComfyUI-custom-api/issues"

[tool.comfy]
# Set this to the actual publisher ID created at https://registry.comfy.org.
PublisherId = ""
DisplayName = "ComfyUI Custom API"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
